name: Auto Update Vendordeps

on:
  schedule:
    - cron: "0 19 * * 3"   # Every Wednesday at 19:00 UTC
  workflow_dispatch:

jobs:
  update-vendordeps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update vendordeps
        run: |
          mkdir -p updated
          changed=false

          for file in vendordeps/*.json; do
            echo "Checking $file"

            # Extract jsonUrl from the vendordep file
            url=$(jq -r '.jsonUrl' "$file")

            if [[ "$url" == "null" || -z "$url" ]]; then
              echo "  No jsonUrl found, skipping"
              continue
            fi

            echo "  Downloading latest from $url"
            curl -sSL "$url" -o "updated/$(basename "$file")"

            # Compare with existing vendordep
            if ! diff -q "$file" "updated/$(basename "$file")" > /dev/null; then
              echo "  Update found for $(basename "$file")"
              cp "updated/$(basename "$file")" "$file"
              changed=true
            else
              echo "  No changes"
            fi
          done

          if [[ "$changed" == "false" ]]; then
            echo "No vendordep updates found"
            exit 0
          fi

      - name: Commit changes
        if: success()
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -b auto/update-vendordeps
            git add vendordeps/
            git commit -m "Update vendordeps"
            git push --force --set-upstream origin auto/update-vendordeps
          fi

      - name: Open PR
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/update-vendordeps
          title: "deps: update vendordeps"
          body: "Automated vendordep update"
          labels: dependencies
